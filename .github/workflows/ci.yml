name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The Pulse section is checked against main of Miragon/pulse, which moves
  # without a PR here: a weekly run catches drift between PRs.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  site:
    name: Build + checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm format:check

      # Vendored CI tokens and logos pinned, no forked --cd-* tokens, page budgets.
      - run: pnpm check

      # Also the content gate, failing on dead links: scripts/check-dist.mjs
      # (all of dist, redirects, URL map, legal/consent/form invariants).
      - run: pnpm build

      - uses: Miragon/pin-npm-dependencies@v1.2.2

  # Pulse references. The job keeps the name it had before the repo became
  # Miragon/pulse (2026-10-16), because the main ruleset requires the status
  # check "miragon-ai references"; the script and MIRAGON_AI_DIR keep theirs too.
  miragon-ai-refs:
    name: miragon-ai references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/checkout@v7.0.1
        with:
          repository: Miragon/pulse
          path: .miragon-ai

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      # Tool names on every page, repo paths in src/content/tools/pulse.mdx.
      - run: node scripts/check-miragon-ai-refs.mjs
        env:
          MIRAGON_AI_DIR: .miragon-ai

  brand:
    name: Brand (CI source + brand-lint)
    runs-on: ubuntu-latest
    env:
      # Read access to the private Miragon/corporate-identity. Without the
      # secret (not set up yet, or a fork PR) the job warns and skips; the
      # pinned hashes in the site job still hold.
      CI_SOURCE_TOKEN: ${{ secrets.CORPORATE_IDENTITY_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: No access to Miragon/corporate-identity
        if: env.CI_SOURCE_TOKEN == ''
        run: echo "::warning title=Brand checks skipped::CORPORATE_IDENTITY_READ_TOKEN is not set, so the vendored tokens and logos are not compared with Miragon/corporate-identity and brand-lint does not run. Add the secret (contents:read on Miragon/corporate-identity)."

      # Keep ref on the release pinned as BRAND.version in scripts/check-brand-assets.mjs.
      - uses: actions/checkout@v7.0.1
        if: env.CI_SOURCE_TOKEN != ''
        with:
          repository: Miragon/corporate-identity
          ref: v1.9.0
          token: ${{ env.CI_SOURCE_TOKEN }}
          path: .ci-source
          sparse-checkout: plugins/miragon-brand

      - uses: actions/setup-node@v7.0.0
        if: env.CI_SOURCE_TOKEN != ''
        with:
          node-version: 22

      - name: Vendored tokens and logos equal the CI source
        if: env.CI_SOURCE_TOKEN != ''
        run: node scripts/check-brand-assets.mjs
        env:
          MIRAGON_BRAND_DIR: .ci-source/plugins/miragon-brand

      # Rules and exceptions come from .miragon/brand.json.
      - name: brand-lint
        if: env.CI_SOURCE_TOKEN != ''
        run: node .ci-source/plugins/miragon-brand/scripts/brand-lint.mjs --nur-hart .
