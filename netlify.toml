# Netlify deployment of https://miragon.ai: a static Astro build (no
# adapter), published from dist/. Every page is <path>/index.html and is
# linked as /<path>/; Netlify serves /<path> from the same file.
#
# One-time site setup in the Netlify UI:
# - Forms > Enable form detection (the landing-page contact form posts to
#   Netlify Forms; detection runs during deploy post-processing)
# - Keep post-processing HTML minification OFF: it strips the comment
#   markers the Vue islands (LifecycleMap, BrandContact) hydrate
#   from.

[build]
  # rm -rf node_modules/.astro: a cached content store can keep a stale
  # Expressive Code stylesheet link (unstyled code blocks).
  command = "rm -rf node_modules/.astro; pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Astro hashes every file under /_astro/, so it never changes in place.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Redirects. Netlify applies the first matching rule and matches a source
# with and without its trailing slash. No rule is forced, so a file at a
# source path would shadow its rule: scripts/check-dist.mjs fails the build
# on that, on a target on this site that is not a page, and on any old URL in
# scripts/url-map.json that does not land on its new URL in one hop.
# No Astro `redirects` either: without an adapter they become meta-refresh
# pages that shadow these rules.

# Pulse's four reference pages, live at the root until this site replaced
# the old one. They live in Pulse's docs site, built from docs/ of
# Miragon/pulse and served on GitHub Pages (miragon.github.io/pulse/; the
# old path /miragon-ai/ has been a 404 since the repo's rename on
# 2026-10-16, because GitHub Pages does not redirect).
[[redirects]]
  from = "/architecture"
  to = "https://miragon.github.io/pulse/architecture"
  status = 301

[[redirects]]
  from = "/architecture.html"
  to = "https://miragon.github.io/pulse/architecture"
  status = 301

[[redirects]]
  from = "/developer"
  to = "https://miragon.github.io/pulse/developer"
  status = 301

[[redirects]]
  from = "/developer.html"
  to = "https://miragon.github.io/pulse/developer"
  status = 301

[[redirects]]
  from = "/operations"
  to = "https://miragon.github.io/pulse/operations"
  status = 301

[[redirects]]
  from = "/operations.html"
  to = "https://miragon.github.io/pulse/operations"
  status = 301

[[redirects]]
  from = "/usage"
  to = "https://miragon.github.io/pulse/usage"
  status = 301

[[redirects]]
  from = "/usage.html"
  to = "https://miragon.github.io/pulse/usage"
  status = 301
