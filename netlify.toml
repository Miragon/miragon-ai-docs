  status = 301

[[redirects]]
  from = "/docs/skills"
  to = "/docs/skills/getting-started/"
  status = 301

[[redirects]]
  from = "/docs/solution-templates"
  to = "/docs/solution-templates/getting-started/"
  status = 301

[[redirects]]
  from = "/docs/pulse"
  to = "/docs/pulse/getting-started/"
